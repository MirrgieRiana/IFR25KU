<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>IFR25KU Lang Table</title>
    <style>
        #langTable {
            border-collapse: collapse;
            table-layout: fixed;
            width: 100%;
        }

        #langTable th {
            background-color: #ddd;
        }
        #langTable tbody tr:nth-child(even) {
            background-color: #eee;
        }

        #langTable th, #langTable td {
            padding: 0 0.5em;
        }
        #langTable th.value, #langTable td.value {
            border-left: 1px solid #888;
        }

        #langTable td.key {
            word-break: break-all;
        }
        #langTable td.value {
            white-space: pre-line;
            vertical-align: top;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>
<h1>IFR25KU Lang Table</h1>
<table id="langTable">
    <colgroup>
        <col style="width: 30%;">
        <col style="width: 35%;">
        <col style="width: 35%;">
    </colgroup>
    <thead>
    <tr>
        <th class="key">Key</th>
        <th class="value">English</th>
        <th class="value">Japanese</th>
    </tr>
    </thead>
    <tbody id="lang_table">
    <%= trs %>
    </tbody>
</table>
</body>
</html>
