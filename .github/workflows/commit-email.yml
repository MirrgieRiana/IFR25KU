name: commit-email
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: commit-email-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-email:
    runs-on: ubuntu-latest
    steps:

      # セットアップ
      - uses: actions/checkout@v6
        with:
          # base..headの範囲を辿るために全履歴が必要なのだ～🌱 既定の深さ1では範囲が引けないのだぁ…🌧️
          fetch-depth: 0
      - name: xarpiteのセットアップ
        run: |
          # ランタイムの実体はリポジトリに入っていないから、同梱のスクリプトに持ってきてもらうのだ～🌱
          ./xarpite/xarpite-update -y
          # ステップのshellに書くコマンドはPATHから探されて、相対パスでは見つからないのだぁ…🌧️
          echo "$PWD/xarpite" >> "$GITHUB_PATH"

      # メールアドレスの検査
      - name: メールアドレスの検査
        env:
          BLOCKED_COMMIT_EMAIL: ${{ secrets.BLOCKED_COMMIT_EMAIL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: xarpite -A 5 -q -f {0}
        run: |
          # 空白だけの行は、どのコミットにも一致してしまうから、先に落としておくのだぁ…🌧️
          # 大文字小文字を区別せずに比べるために、あらかじめ小文字にしておくのだ～🌱
          patterns := (ENV.BLOCKED_COMMIT_EMAIL ?: "") >> LINES >> FILTER [ _ => _ !~ /^\s*$/ ] >> LC >> TO_ARRAY

          # シークレットを設定するまでの間や、シークレットが渡らないforkからのPRでは、検査をとばすのだぁ…🌧️
          patterns.$# == 0 && (
            OUT << "::warning::シークレットBLOCKED_COMMIT_EMAILが空だから、メールアドレスの検査をとばすのだぁ…🌧️"
            EXIT(0)
          )

          # PRの画面に並ぶのと同じ範囲のコミットを、1個ずつ見ていくのだ～🌱
          found := FALSE
          EXEC("git", "rev-list", "$(ENV.BASE_SHA)..$(ENV.HEAD_SHA)") >> LINES | commit => (
            # 見るのは、著者とコミッターとコミットメッセージの全体なのだ～🌱 Co-Authored-Byの行も、ここに入るのだ～🌱
            target := EXEC("git", "show", "--no-patch", '--format=%an <%ae>%n%cn <%ce>%n%B', commit) >> LC
            # 検査対象のメールアドレスをログに残さないように、報告するのは引っかかったコミットのハッシュだけなのだ～🌱
            (patterns() | _ @ target >> ANY) && (
              OUT << "::error::コミット $commit に、混ぜてはいけないメールアドレスが入っているのだぁ…🌧️"
              found = TRUE
            )
          )

          EXIT(found ? 1 : 0)
