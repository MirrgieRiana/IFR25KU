name: check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

      # セットアップ
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v5

      # ビルド
      - name: ビルド
        run: ./gradlew build -x :site:build

  build-site:
    runs-on: ubuntu-latest
    steps:

      # セットアップ
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # OG画像の生成環境
      # ブラウザ本体はinstallPlaywrightBrowsersタスクが取得するから、ここでは共有ライブラリだけを入れるのだ～🌱
      - name: ヘッドレスブラウザの共有ライブラリのインストール
        run: npx --yes playwright@1.58.0 install-deps chromium
      # installPlaywrightBrowsersの成果物は、setup-gradleがキャッシュする~/.gradle/の範囲外なのだ～🌱
      - name: ヘッドレスブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: site/build/playwrightBrowsers
          key: playwright-${{ runner.os }}-1.58.0
      # ランナーにはCJKのグリフを持つフォントが無くて、入れないとタイトルの文字が全て豆腐になっちゃうのだぁ…🌧️
      - name: 日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk

      # ビルド
      - name: ビルド
        run: ./gradlew :site:build

  datagen:
    runs-on: ubuntu-latest
    steps:

      # セットアップ
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v5

      # datagen
      - name: datagen
        run: ./gradlew :datagen

      # 差分チェック
      - name: 差分チェック
        run: |
          git add -A
          git diff --cached --exit-code
