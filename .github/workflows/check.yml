name: check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

      # セットアップ
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v5

      # ビルド
      - name: ビルド
        run: ./gradlew build -x :site:build

  build-site:
    runs-on: ubuntu-latest
    steps:

      # セットアップ
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # ビルド
      - name: ビルド
        run: ./gradlew :site:build

  datagen:
    runs-on: ubuntu-latest
    steps:

      # セットアップ
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v5

      # datagen
      - name: datagen
        run: ./gradlew :datagen

      # 差分チェック
      - name: 差分チェック
        run: |
          git add -A
          git diff --cached --exit-code

  commit-email:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:

      # セットアップ
      - uses: actions/checkout@v6
        with:
          # base..headの範囲を辿るために全履歴が必要なのだ～🌱 既定の深さ1では範囲が引けないのだぁ🌧️
          fetch-depth: 0

      # メールアドレスの検査
      - name: メールアドレスの検査
        env:
          BLOCKED_COMMIT_EMAIL: ${{ secrets.BLOCKED_COMMIT_EMAIL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 空行はgrepの空パターンになってすべてのコミットに一致してしまうから、あらかじめ落としておくのだ～🌱
          patterns=$(printf '%s\n' "$BLOCKED_COMMIT_EMAIL" | grep -v '^[[:space:]]*$' || true)
          # シークレットを設定するまでの間や、シークレットが渡らないforkからのPRでは、検査をとばすのだぁ🌧️
          if [ -z "$patterns" ]; then
            echo '::warning::シークレットBLOCKED_COMMIT_EMAILが空だから、メールアドレスの検査をとばすのだぁ🌧️'
            exit 0
          fi
          # 検査対象のメールアドレスをログに残さないように、grepの出力は捨てて、引っかかったコミットのハッシュだけを報告するのだ～🌱
          status=0
          for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if git show --no-patch --format='%an <%ae>%n%cn <%ce>%n%B' "$commit" | grep -qiF -e "$patterns"; then
              echo "::error::コミット $commit に、混ぜてはいけないメールアドレスが入っているのだぁ🌧️"
              status=1
            fi
          done
          exit $status
